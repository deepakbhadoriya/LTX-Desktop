[project]
name = "ltx-desktop-backend"
version = "1.0.0"
description = "LTX-2 Video Generation Backend"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.3.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "ftfy>=6.0.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "protobuf>=3.20.0",
    "sentencepiece>=0.1.99",
    "opencv-python-headless>=4.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # CUDA/torch inference dependencies — not needed on macOS (MLX used instead)
    "torch>=2.3.0; sys_platform != 'darwin'",
    "ltx-core; sys_platform != 'darwin'",
    "ltx-pipelines; sys_platform != 'darwin'",
    "diffusers>=0.36.0; sys_platform != 'darwin'",
    "peft>=0.13.2; sys_platform != 'darwin'",
    "transformers>=4.52,<5; sys_platform != 'darwin'",
    "transformers>=5.0; sys_platform == 'darwin'",
    "pynvml>=11.5.0; sys_platform != 'darwin'",
    "sageattention>=1.0.0; sys_platform != 'darwin'",
    "triton-windows; sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
    # MLX Apple Silicon inference dependencies
    "mlx>=0.31.0; sys_platform == 'darwin'",
    "ltx-core-mlx; sys_platform == 'darwin'",
    "ltx-pipelines-mlx; sys_platform == 'darwin'",
    "mflux>=0.16.0; sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "01de02e8b4f2cc91df4f3e91cb6535ebcbeb490c" }
ltx-core = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-core", rev = "59ca828d5ae24358832ffd7003c2306fbceeba3a" }
ltx-pipelines = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-pipelines", rev = "59ca828d5ae24358832ffd7003c2306fbceeba3a" }
ltx-core-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx.git", subdirectory = "packages/ltx-core-mlx", rev = "de4a12d3cd14f345b2ec680eb63f4114b927b435" }
ltx-pipelines-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx.git", subdirectory = "packages/ltx-pipelines-mlx", rev = "de4a12d3cd14f345b2ec680eb63f4114b927b435" }

[project.optional-dependencies]
test = ["pytest>=8.0", "requests>=2.31", "httpx>=0.27"]
dev = ["pyright>=1.1.380", "debugpy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
